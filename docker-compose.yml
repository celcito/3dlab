services:
  triposr:
    build: ./python
    container_name: 3dlab-triposr
    ports:
      - "8001:8001"
    volumes:
      - jobs-data:/tmp/jobs
      # Cache dos modelos HuggingFace — evita baixar a cada restart
      - hf-cache:/root/.cache/huggingface
    environment:
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: 3dlab-app
    ports:
      - "3001:3000"
    volumes:
      - jobs-data:/app/tmp/jobs
    environment:
      - IMG2_3D_PY_URL=http://triposr:8001
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NODE_ENV=production
    depends_on:
      triposr:
        condition: service_healthy
    restart: unless-stopped

volumes:
  jobs-data:
  hf-cache: