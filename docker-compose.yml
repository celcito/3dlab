services:
  triposr:
    build: ./python
    container_name: 3dlab-triposr
    ports:
      - "8001:8001"
    volumes:
      - jobs-data:/tmp/jobs
    environment:
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: 3dlab-app
    ports:
      - "3001:3000"
    volumes:
      - jobs-data:/app/tmp/jobs
    environment:
      - IMG2_3D_PY_URL=http://triposr:8001
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NODE_ENV=production
    depends_on:
      - triposr
    restart: unless-stopped

volumes:
  jobs-data:
